name: Blast radius

# Measures how much public code still points at Microsoft 365 SMTP, once a
# week, and publishes the result to the `status` branch so the series can be
# checked rather than taken on trust.
#
# Why bother: nobody has published this number. Every article about the
# December 2026 Basic auth shutdown says "many systems will be affected",
# which is a shrug rather than a fact. GitHub code search can put a floor
# under it, and the weekly series answers the question a single number
# cannot - is anybody actually fixing this?
#
# The measurement is deliberately conservative. It counts public files
# containing a hostname, not systems that will break, and docs/BLAST-RADIUS.md
# says so at length. A figure that claims more than it can support is a figure
# the first informed reader discards.

on:
  schedule:
    - cron: '0 6 * * 1'      # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write            # publishes the sample and the badge to `status`

concurrency:
  group: blast-radius
  cancel-in-progress: false

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Measure
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Today's date comes from the runner rather than from Python, so
          # that the sample date and the commit date cannot disagree.
          today=$(date -u +%Y-%m-%d)
          echo "date=$today" >> "$GITHUB_ENV"

          counts='{}'
          failures=0
          total=0

          # jq -c so each query object survives the loop intact; the query
          # strings contain spaces and quotes.
          while read -r row; do
            id=$(echo "$row" | jq -r .id)
            q=$(echo "$row" | jq -r .q)
            total=$((total + 1))

            n=""
            # The broadest phrases make GitHub's search API time out. Retry
            # a few times before giving up; a transient 408 is common.
            for attempt in 1 2 3 4; do
              n=$(gh api -X GET search/code -f q="$q" -f per_page=1 \
                    --jq .total_count 2>/dev/null || true)
              case "$n" in
                ''|*message*|*[!0-9]*) n=""; sleep 15 ;;
                *) break ;;
              esac
            done

            if [ -z "$n" ]; then
              echo "::warning::'$q' could not be counted - recording null"
              failures=$((failures + 1))
              counts=$(echo "$counts" | jq --arg k "$id" '.[$k] = null')
            else
              echo "$q -> $n"
              counts=$(echo "$counts" | jq --arg k "$id" --argjson v "$n" '.[$k] = $v')
            fi

            # Code search allows 10 authenticated requests a minute.
            sleep 10
          done < <(jq -c '.queries[]' data/blast-radius.json)

          # A run where nothing could be counted must not append a row of
          # nulls: that is an outage, and a gap in the series is more honest
          # than a fabricated low point.
          if [ "$failures" = "$total" ]; then
            echo "::error::All $total queries failed. Not recording a sample."
            exit 1
          fi

          # Replace today's sample if one exists, so a re-run corrects rather
          # than duplicates.
          jq --arg d "$today" --argjson c "$counts" \
            '.samples = ((.samples | map(select(.date != $d))) + [{date: $d, counts: $c}])
             | .samples |= sort_by(.date)' \
            data/blast-radius.json > tmp.json
          mv tmp.json data/blast-radius.json

      - name: Render the page
        run: python tools/build-blast-radius.py

      - name: Publish the sample and the badge
        run: |
          set -euo pipefail

          # This step used to `git push` the sample straight to main. main is
          # protected with enforce_admins on, so every single run ended in
          # `GH006: Protected branch update failed` - measuring the number
          # correctly over two minutes and then throwing it away.
          #
          # A pull request is not a way out either: a PR opened with
          # GITHUB_TOKEN does not trigger workflows, so the checks main
          # requires would never report and it would sit unmergeable forever.
          # Making that work needs a PAT in the repository secrets, and there
          # are none.
          #
          # So the series lives on the unprotected `status` branch, which the
          # badge already uses and which the bot can write to. Nothing here
          # touches main. docs/BLAST-RADIUS.md on main is refreshed by a
          # person running `tools/build-blast-radius.py` against this file -
          # and `lint.yml` keeps the committed page honest against whatever
          # data/blast-radius.json says at the time.

          # Largest single measured count. Deliberately not a sum: one file
          # can contain both hostnames, and a total would double-count.
          # Count first, label second: `read` splits on the first space, so a
          # label that ever contains one would otherwise silently take part
          # of the number with it. Today's labels are hostnames, but the
          # queries are data and data changes.
          read -r value label < <(
            jq -r '
              (.samples | last | .counts) as $c
              | [.queries[] | select($c[.id] != null) | {label, n: $c[.id]}]
              | if length == 0 then "0 none"
                else (max_by(.n) | "\(.n) \(.label)") end' \
              data/blast-radius.json)

          cp data/blast-radius.json /tmp/blast-radius-samples.json

          git fetch -q origin status
          # -f on purpose. The Measure and Render steps leave modified copies
          # of data/blast-radius.json and docs/BLAST-RADIUS.md in the working
          # tree, and those deliberately do not go anywhere now that this
          # workflow no longer writes to main - the sample has just been
          # copied to /tmp. Without -f, checkout refuses to overwrite them and
          # the step dies before publishing anything.
          git checkout -q -f -B status origin/status

          cp /tmp/blast-radius-samples.json blast-radius-samples.json

          if [ "$label" != "none" ]; then
            formatted=$(printf "%'d" "$value" | tr ',' ' ')
            cat > blast-radius.json <<JSON
          {"schemaVersion":1,"label":"$label in public code","message":"$formatted files","color":"critical"}
          JSON
          else
            echo "Nothing measured; badge left unchanged."
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blast-radius-samples.json
          # The badge file may not exist yet on the status branch - the step
          # that used to write it never once ran to completion.
          if [ -f blast-radius.json ]; then
            git add blast-radius.json
          fi
          if git diff --cached --quiet; then
            echo "Sample and badge unchanged - nothing to publish."
            exit 0
          fi

          git commit -q -m "status: blast radius ${{ env.date }}"

          # service-healthcheck.yml writes status.json to this same branch
          # every 15 minutes, so a collision here is a matter of when, not if.
          for attempt in 1 2 3; do
            if git push -q origin status; then
              echo "Published sample and badge for ${{ env.date }}."
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}/3) - rebasing onto origin/status."
            git fetch -q origin status
            git rebase -q origin/status || { git rebase --abort || true; }
            sleep $((attempt * 3))
          done

          echo "::error::Could not publish the blast radius sample after 3 attempts."
          exit 1
