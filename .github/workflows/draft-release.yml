name: Draft release

# Turns the latest CHANGELOG entry into a GitHub Draft release the moment a
# semantic-version tag is pushed. Draft, not published: a release is the
# project's public face, and the person who owns the project decides when it
# is ready. The workflow's only job is to make that decision a formality by
# preparing the notes, the artifact list and the links.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Extract the CHANGELOG entry for this version
        id: notes
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"          # v1.4.0
          VERSION="${TAG#v}"                       # 1.4.0

          # The CHANGELOG uses "## [X.Y.Z] - date" headers. Pull everything
          # from the first matching header up to (not including) the next one.
          NOTES=$(awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md)

          if [ -z "$NOTES" ]; then
            echo "::error::No CHANGELOG entry for $VERSION. Add one before tagging."
            exit 1
          fi

          # Trim leading/trailing blank lines and keep the rest verbatim,
          # so markdown inside the entry survives untouched.
          NOTES=$(printf '%s\n' "$NOTES" | sed '/^[[:space:]]*$/d')

          # Write the notes to a file, not to a step output variable.
          # Apostrophes in the notes (e.g. "Microsoft's") would break the
          # shell quoting when the output is interpolated into a later step,
          # so the entire body is assembled here and passed via --notes-file.
          {
            printf '%s\n' "$NOTES"
            printf '\n---\n\n## First time here?\n\n- [Docs](https://docs.msgwing.com/) - setup, troubleshooting, migration guide\n- [Getting started](https://github.com/${{ github.repository }}#quickstart) - the whole API in four lines\n- [Code examples](https://github.com/${{ github.repository }}#code-examples) - 21 ready-to-run files across 19 languages\n\n_Draft prepared automatically. Publish when ready._\n'
          } > body.md

      - name: Create the draft release
        run: |
          set -euo pipefail

          # --draft is the entire point: nothing goes public without a click.
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "$GITHUB_REF_NAME" \
            --notes-file body.md \
            --repo "$GITHUB_REPOSITORY"
