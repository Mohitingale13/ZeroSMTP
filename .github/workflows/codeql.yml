name: CodeQL

# Security scanning for the languages CodeQL supports without a full build
# step (build-mode: none) — JavaScript/TypeScript and Python. Compiled
# languages in this repo (Java/Kotlin, C#, Go, Rust, Swift) would need real
# build environments beyond lint.yml's syntax checks to analyze properly,
# and PHP/Bash/PowerShell aren't supported by CodeQL at all — both are
# intentionally out of scope here rather than configured to silently fail.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 3' # Wednesdays 06:00 UTC

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript', 'python']
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
