<svg viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4a5568"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="320" fill="#ffffff"/>

  <!-- Box 1: client device -->
  <rect x="20" y="110" width="200" height="100" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="120" y="145" text-anchor="middle" font-size="15" font-weight="bold" fill="#312e81">Printer / App /</text>
  <text x="120" y="165" text-anchor="middle" font-size="15" font-weight="bold" fill="#312e81">IoT Device</text>
  <text x="120" y="188" text-anchor="middle" font-size="12" fill="#4338ca">(SMTP client)</text>

  <!-- Arrow 1 -->
  <line x1="220" y1="160" x2="350" y2="160" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="285" y="130" text-anchor="middle" font-size="11.5" fill="#374151">SMTP AUTH LOGIN</text>
  <text x="285" y="146" text-anchor="middle" font-size="11.5" fill="#374151">STARTTLS :587 or SSL/TLS :465</text>

  <!-- Box 2: ZeroSMTP relay -->
  <rect x="350" y="90" width="220" height="140" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="460" y="130" text-anchor="middle" font-size="15" font-weight="bold" fill="#065f46">mx.msgwing.com</text>
  <text x="460" y="152" text-anchor="middle" font-size="12" fill="#047857">ZeroSMTP relay</text>
  <text x="460" y="172" text-anchor="middle" font-size="11.5" fill="#047857">Outgoing mail only</text>
  <text x="460" y="190" text-anchor="middle" font-size="11.5" fill="#047857">No inbox / IMAP / POP3</text>
  <text x="460" y="208" text-anchor="middle" font-size="11.5" fill="#047857">on this account</text>

  <!-- Arrow 2 -->
  <line x1="570" y1="160" x2="680" y2="160" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="625" y="146" text-anchor="middle" font-size="11.5" fill="#374151">relay</text>

  <!-- Box 3: recipient -->
  <rect x="680" y="110" width="200" height="100" rx="10" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="780" y="150" text-anchor="middle" font-size="15" font-weight="bold" fill="#92400e">Recipient</text>
  <text x="780" y="172" text-anchor="middle" font-size="15" font-weight="bold" fill="#92400e">Mailbox</text>

  <!-- footer note -->
  <text x="450" y="275" text-anchor="middle" font-size="12" fill="#6b7280">Login is a randomly generated @msgwing.com address, created after registering and activating an account at https://msgwing.com</text>
  <text x="450" y="295" text-anchor="middle" font-size="12" fill="#6b7280">Original illustrative diagram — not affiliated with or depicting any specific printer or software vendor UI.</text>
</svg>
