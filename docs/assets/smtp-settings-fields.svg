<svg viewBox="0 0 700 460" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="700" height="460" fill="#ffffff"/>

  <!-- Window chrome -->
  <rect x="20" y="20" width="660" height="420" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="20" y="20" width="660" height="40" rx="8" fill="#e5e7eb" stroke="#d1d5db" stroke-width="1.5"/>
  <circle cx="42" cy="40" r="6" fill="#f87171"/>
  <circle cx="62" cy="40" r="6" fill="#fbbf24"/>
  <circle cx="82" cy="40" r="6" fill="#34d399"/>
  <text x="350" y="45" text-anchor="middle" font-size="13" fill="#374151">Generic SMTP / Outgoing Mail Settings (illustrative)</text>

  <!-- Field template -->
  <!-- SMTP Server -->
  <text x="45" y="100" font-size="13" fill="#374151">SMTP Server / Outgoing Server</text>
  <rect x="45" y="108" width="610" height="34" rx="6" fill="#ffffff" stroke="#9ca3af"/>
  <text x="58" y="130" font-size="13" fill="#111827" font-family="Consolas, monospace">mx.msgwing.com</text>

  <!-- Port + Encryption -->
  <text x="45" y="168" font-size="13" fill="#374151">Port</text>
  <rect x="45" y="176" width="180" height="34" rx="6" fill="#ffffff" stroke="#9ca3af"/>
  <text x="58" y="198" font-size="13" fill="#111827" font-family="Consolas, monospace">587 or 465</text>

  <text x="255" y="168" font-size="13" fill="#374151">Encryption / Security</text>
  <rect x="255" y="176" width="400" height="34" rx="6" fill="#ffffff" stroke="#9ca3af"/>
  <text x="268" y="198" font-size="13" fill="#111827" font-family="Consolas, monospace">STARTTLS (587)  or  SSL/TLS (465) — required</text>

  <!-- Username -->
  <text x="45" y="236" font-size="13" fill="#374151">Username / Login</text>
  <rect x="45" y="244" width="610" height="34" rx="6" fill="#ffffff" stroke="#9ca3af"/>
  <text x="58" y="266" font-size="13" fill="#111827" font-family="Consolas, monospace">randomly-generated-login@msgwing.com</text>

  <!-- Password -->
  <text x="45" y="304" font-size="13" fill="#374151">Password</text>
  <rect x="45" y="312" width="610" height="34" rx="6" fill="#ffffff" stroke="#9ca3af"/>
  <text x="58" y="334" font-size="13" fill="#111827" font-family="Consolas, monospace">••••••••••••  (copied once from msgwing.com after login)</text>

  <!-- Authentication toggle -->
  <text x="45" y="372" font-size="13" fill="#374151">SMTP Authentication</text>
  <rect x="255" y="360" width="20" height="20" rx="4" fill="#10b981" stroke="#059669"/>
  <text x="285" y="376" font-size="13" fill="#065f46">Enabled (required)</text>

  <text x="350" y="415" text-anchor="middle" font-size="11.5" fill="#6b7280">Field names vary by vendor (e.g. "Outgoing Server", "SMTP Host", "Mail Server") — the values above stay the same everywhere.</text>
  <text x="350" y="432" text-anchor="middle" font-size="11.5" fill="#6b7280">Original illustrative diagram — not affiliated with or depicting any specific vendor's actual interface.</text>
</svg>
