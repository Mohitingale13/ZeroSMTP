<svg viewBox="0 0 760 480" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="480" fill="#ffffff"/>

  <!-- Window chrome -->
  <rect x="20" y="20" width="720" height="440" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="20" y="20" width="720" height="40" rx="8" fill="#e5e7eb" stroke="#d1d5db" stroke-width="1.5"/>
  <circle cx="42" cy="40" r="6" fill="#f87171"/>
  <circle cx="62" cy="40" r="6" fill="#fbbf24"/>
  <circle cx="82" cy="40" r="6" fill="#34d399"/>
  <text x="380" y="45" text-anchor="middle" font-size="13" fill="#374151">web.config &lt;system.net&gt;&lt;mailSettings&gt; — illustrative</text>

  <!-- host -->
  <text x="45" y="100" font-size="13" fill="#374151">host (SMTP server)</text>
  <rect x="45" y="108" width="670" height="34" rx="6" fill="#ffffff" stroke="#9ca3af"/>
  <text x="58" y="130" font-size="13" fill="#111827" font-family="Consolas, monospace">mx.msgwing.com</text>

  <!-- port + enableSsl -->
  <text x="45" y="168" font-size="13" fill="#374151">port</text>
  <rect x="45" y="176" width="200" height="34" rx="6" fill="#ffffff" stroke="#9ca3af"/>
  <text x="58" y="198" font-size="13" fill="#111827" font-family="Consolas, monospace">587 or 465</text>

  <text x="275" y="168" font-size="13" fill="#374151">enableSsl</text>
  <rect x="275" y="176" width="440" height="34" rx="6" fill="#ffffff" stroke="#9ca3af"/>
  <text x="288" y="198" font-size="13" fill="#111827" font-family="Consolas, monospace">true — required, both ports</text>

  <!-- userName -->
  <text x="45" y="236" font-size="13" fill="#374151">userName</text>
  <rect x="45" y="244" width="670" height="34" rx="6" fill="#ffffff" stroke="#9ca3af"/>
  <text x="58" y="266" font-size="13" fill="#111827" font-family="Consolas, monospace">randomly-generated-login@msgwing.com</text>

  <!-- password -->
  <text x="45" y="304" font-size="13" fill="#374151">password</text>
  <rect x="45" y="312" width="670" height="34" rx="6" fill="#ffffff" stroke="#9ca3af"/>
  <text x="58" y="334" font-size="13" fill="#111827" font-family="Consolas, monospace">••••••••••••  (copied once from msgwing.com after login)</text>

  <!-- deliveryMethod -->
  <text x="45" y="372" font-size="13" fill="#374151">deliveryMethod</text>
  <rect x="45" y="380" width="670" height="34" rx="6" fill="#ffffff" stroke="#9ca3af"/>
  <text x="58" y="402" font-size="13" fill="#111827" font-family="Consolas, monospace">Network  (NOT PickupDirectoryFromIis / SpecifiedPickupDirectory)</text>

  <text x="380" y="440" text-anchor="middle" font-size="11.5" fill="#6b7280">Field names shown match .NET's System.Net.Mail config exactly — same values work for PHPMailer, Symfony Mailer, or any other library.</text>
  <text x="380" y="457" text-anchor="middle" font-size="11.5" fill="#6b7280">Original illustrative diagram — not a screenshot of any Microsoft product.</text>
</svg>
